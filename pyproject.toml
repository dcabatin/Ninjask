[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ninjask"
version = "0.1.0"
description = "A Pokémon Champions VGC doubles simulator that matches Pokémon Showdown exactly, about 200 times faster"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["pokemon", "showdown", "vgc", "simulator", "battle", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # the χ² comparison in ninjask.verify
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.urls]
Repository = "https://github.com/dcabatin/Ninjask"
Issues = "https://github.com/dcabatin/Ninjask/issues"
Changelog = "https://github.com/dcabatin/Ninjask/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8.0"]

# The `ninjask` package (python/ninjask) with the compiled module inside it,
# `ninjask._core`, which the package re-exports (`ninjask.Battle`, ...).
[tool.maturin]
features = ["python-module"]
python-source = "python"
module-name = "ninjask._core"
# Release profile keeps debug info for profiling; wheels do not need it
strip = true
# The format exports and fixture teams that scripts/bundle_data.sh generates
# (git ignores them), so an installed wheel needs no Showdown checkout.
include = [
    { path = "python/ninjask/data/**/*", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
