[package]
name = "ninjask"
version = "0.1.0"
edition = "2021"
description = "A Pokémon Champions VGC doubles simulator that matches Pokémon Showdown exactly, about 250 times faster"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dcabatin/Ninjask"
documentation = "https://docs.rs/ninjask"
categories = ["simulation", "game-development"]
keywords = ["pokemon", "showdown", "vgc", "simulator", "battle"]
# The crate as published: the engine, its examples and tests, without the
# Python package and the reference harness (pyproject.toml ships those).
include = ["src/", "examples/", "tests/", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md", "Cargo.toml", "Cargo.lock"]

[lib]
name = "ninjask"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The Python classes and `python::register`, for a crate that builds its own
# extension module around them (README, "Embedding in another extension").
python = ["dep:pyo3"]
# The `ninjask._core` extension module itself (pyproject.toml).
python-module = ["python"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }
arrayvec = "0.7"
smallvec = { version = "1.13", features = ["union", "const_generics"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
